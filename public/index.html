<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calzone — Lineheart calendar URL converter</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 20px; font-weight: 600; font-size: 0.9rem; }
  input { width: 100%; padding: 8px; font-size: 0.95rem; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 18px; font-size: 0.95rem; cursor: pointer; }
  #result { margin-top: 24px; padding: 12px; background: #f4f4f4; word-break: break-all; font-family: monospace; font-size: 0.85rem; display: none; }
  #copyBtn { margin-top: 8px; display: none; }
  .error { color: #b00020; margin-top: 12px; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Lineheart calendar URL converter</h1>
  <p>Converts a source .ics URL into a calzone-wrapped subscription URL for Google Calendar.</p>

  <label for="src">Source calendar URL</label>
  <input id="src" type="text" placeholder="https://conge.lineheart.lu/intervention/....ics">

  <label for="tz">Timezone (optional, defaults to Europe/Luxembourg)</label>
  <input id="tz" type="text" placeholder="Europe/Luxembourg">

  <button onclick="convert()">Convert</button>

  <div id="error" class="error"></div>
  <div id="result"></div>
  <button id="copyBtn" onclick="copyResult()">Copy</button>

  <script>
    function convert() {
      const src = document.getElementById('src').value.trim();
      const tz = document.getElementById('tz').value.trim();
      const errorEl = document.getElementById('error');
      const resultEl = document.getElementById('result');
      const copyBtn = document.getElementById('copyBtn');
      errorEl.textContent = '';
      resultEl.style.display = 'none';
      copyBtn.style.display = 'none';

      if (!src) {
        errorEl.textContent = 'Enter a source URL first.';
        return;
      }
      try {
        new URL(src);
      } catch {
        errorEl.textContent = 'That doesn\'t look like a valid URL.';
        return;
      }

      let wrapped = location.origin + '/?url=' + encodeURIComponent(src);
      if (tz) wrapped += '&tz=' + encodeURIComponent(tz);

      resultEl.textContent = wrapped;
      resultEl.style.display = 'block';
      copyBtn.style.display = 'inline-block';
    }

    function copyResult() {
      navigator.clipboard.writeText(document.getElementById('result').textContent);
    }
  </script>
</body>
</html>
